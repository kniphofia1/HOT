[project]
name = "hot-radar-backend"
version = "0.1.0"
description = "Milestone 1 backend shell for Researcher Intelligence Radar."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
